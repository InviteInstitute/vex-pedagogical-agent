<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEX Conversation Agent</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1b2e; }
    /* ?embed=1: the client overlays the avatar on VEXcode VR, so let it show through
       (the build's TransparentBackground.jslib clears the canvas to transparent). */
    html.embed, html.embed body { background: transparent; }
    html.embed #msg { display: none; }
    #unity-canvas { width: 100vw; height: 100vh; display: block; }
    #msg { position: fixed; top: 8px; left: 8px; color: #fff; font: 13px system-ui; opacity: .7; }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>
  <div id="msg">loading…</div>
  <script>
    // ---- Config ----------------------------------------------------------
    // Unity WebGL build output from BuildScript.BuildWebGL (Build/<NAME>.loader.js etc.).
    const BUILD_NAME = "ai-conversation-agent";
    const BUILD_DIR = `build_out/${BUILD_NAME}/Build`;
    // GameObject in the scene that has the ChatLLM component (verified).
    const CHATLLM_OBJECT = "EventSystem";
    // Overridable via URL: ?serverurl=...&student_id=...&audio=true
    const q = new URLSearchParams(location.search);
    // Default: the site serving this page (nginx proxies the bridge routes there).
    const serverurl = q.get("serverurl") || location.origin;
    const student_id = q.get("student_id") || "fixture_01_1";
    // The avatar speaks replies via the backend's /tts (needs TTS configured there).
    const audioFeedback = q.get("audio") === "true" ? "true" : "false";
    const embedded = q.get("embed") === "1" && window.parent !== window;
    // ?mode=avatar: the embedding client draws the chat; Unity shows only the character
    // (framed to the top `framing` of the body, 1 = head to feet) and says what it's sent.
    const avatarOnly = q.get("mode") === "avatar";
    const framing = q.get("framing") || "1";
    // ---------------------------------------------------------------------

    if (embedded) document.documentElement.classList.add("embed");

    // Proactive check-ins come from the embedding client (it holds the push stream and
    // sends them only after the "avatar-ready" message below). Each goes to ChatLLM to
    // show and speak, with block names bolded for TextMeshPro like the bridge's replies.
    let unity = null;
    const speechUrl = (text) => `${serverurl}/tts?text=${encodeURIComponent(text)}`;
    const deliver = (text) => {
      const shown = text.replace(/`([^`]+)`/g, "<b>$1</b>");
      const audio = audioFeedback === "true" ? speechUrl(text) : "";
      unity.SendMessage(CHATLLM_OBJECT, "ReceiveProactiveJson", JSON.stringify({ text: shown, audio }));
    };
    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin || event.source !== window.parent || !unity) return;
      const data = event.data || {};
      if (data.type === "proactive" && data.text) deliver(data.text);
      // Avatar-only: say a reply (audio off -> gesture only, e.g. when muted).
      if (data.type === "speak" && data.text) {
        const audio = data.audio === false ? "" : speechUrl(data.text);
        unity.SendMessage(CHATLLM_OBJECT, "Speak", JSON.stringify({ text: data.text, audio }));
      }
      if (data.type === "hush") unity.SendMessage(CHATLLM_OBJECT, "Hush");
      if (data.type === "framing" && data.framing) {
        unity.SendMessage(CHATLLM_OBJECT, "SetFraming", String(data.framing));
      }
    });
    // Unity -> client: speech started/stopped (AvatarEvents.jslib).
    window.addEventListener("avatar-speaking", (event) => {
      if (embedded) {
        window.parent.postMessage({ type: "avatar-speaking", speaking: event.detail }, location.origin);
      }
    });

    const msg = document.getElementById("msg");
    const missing = () => {
      msg.textContent = `No avatar build in build_out/${BUILD_NAME}/ - see webgl/README.md`;
    };
    // build.json (written by install_build.sh) names this build's version. Fetched
    // uncached, then every build file is requested as ?v=<version>, so a fresh build
    // never mixes with copies a CDN cached under the same names.
    fetch(`build_out/${BUILD_NAME}/build.json?t=${Date.now()}`, { cache: "no-store" })
      .then((response) => (response.ok ? response.json() : Promise.reject()))
      .then(({ version }) => loadBuild(`?v=${encodeURIComponent(version)}`))
      .catch(missing);

    function loadBuild(v) {
      const script = document.createElement("script");
      script.src = `${BUILD_DIR}/${BUILD_NAME}.loader.js${v}`;
      script.onload = () => {
        createUnityInstance(document.querySelector("#unity-canvas"), {
          dataUrl: `${BUILD_DIR}/${BUILD_NAME}.data${v}`,
          frameworkUrl: `${BUILD_DIR}/${BUILD_NAME}.framework.js${v}`,
          codeUrl: `${BUILD_DIR}/${BUILD_NAME}.wasm${v}`,
          streamingAssetsUrl: `build_out/${BUILD_NAME}/StreamingAssets`,
          productName: "VEX Conversation Agent",
        }).then((unityInstance) => {
          msg.remove();
          // ChatLLM prepends "/" to endpoint, so pass it WITHOUT a leading slash.
          const cfg = {
            serverurl,
            endpoint: "generate-feedback-from-text",
            student_id,
            audioFeedback,
            // In the corner over VEXcode VR: no sidebar, transparent behind the avatar.
            compact: embedded && !avatarOnly ? "true" : "false",
            mode: avatarOnly ? "avatar" : "chat",
            framing,
          };
          unityInstance.SendMessage(CHATLLM_OBJECT, "ReceiveConfigJson", JSON.stringify(cfg));
          unity = unityInstance;
          if (embedded) window.parent.postMessage({ type: "avatar-ready" }, location.origin);
        }).catch((e) => { msg.textContent = "Unity load failed: " + e; });
      };
      script.onerror = missing;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
