name: vex-pedagogical-agent

services:
  db:
    # Pinned to a major version: a newer major cannot open this one's data folder.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: vexagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vexagent
    volumes:
      # The pgdata volume by default. The prod server sets DB_DATA to a folder on its data
      # disk (/data/vex-pedagogical-agent/postgres), so the database outlives the root disk.
      - ${DB_DATA:-pgdata}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexagent -d vexagent"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      # Host ports are overridable (API_PORT / DB_PORT in .env) so a second stack can
      # run beside another on the same server.
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  api:
    build: ./server
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    # The Invite Hub sync cursor now lives in Postgres (event_logs.ingest_cursor,
    # migration 013), not a bind-mounted JSON file, so there is nothing to mount
    # here anymore -- a rebuild/recreate can no longer reset it.

volumes:
  pgdata:
